name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'configs/**'
      - 'libwrt.sh'
      - 'scripts/**'
      - '.github/workflows/build.yml'

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss
  CONFIG_FILE: configs/jdcloud_re_ss01.config
  DIY_SCRIPT: libwrt.sh
  FIRMWARE_RELEASE: true
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write  # Delete Old Workflows 步骤删除历史 run 需要, 缺失时报 "Resource not accessible by integration"

# 同分支重复触发时取消旧运行 (防止连续 push 白编)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
    - name: Check Server Performance(检查服务器性能)
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: Initialization Environment(初始化环境)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        docker rmi $(docker images -q) || true
        sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android $AGENT_TOOLSDIRECTORY
        sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
        sudo -E apt-get -y update
        # 依赖清单内联, 不再依赖外链: is.gd/depends_ubuntu_2204 指向的 ophub 文件路径已失效 (curl 404),
        # $(curl) 失败静默展开为空 → apt-get 空跑, 依赖全靠 runner 镜像自带, 属隐性风险
        # 清单源: ophub/amlogic-s9xxx-openwrt make-openwrt/scripts/ubuntu2204-make-openwrt-depends (jammy 实测可用)
        sudo -E apt-get -y install \
          ack antlr3 aria2 asciidoc autoconf automake autopoint binutils bison btrfs-progs \
          build-essential bzip2 ca-certificates ccache cmake coreutils cpio curl \
          device-tree-compiler dwarves fastjar flex g++-multilib gawk gcc-multilib gettext git git-core \
          gperf gzip haveged help2man intltool jq libc6-dev-i386 libelf-dev libfuse-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
          libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool libz-dev lrzsz \
          mkisofs msmtp nano ninja-build ntpdate p7zip p7zip-full patch pigz pkgconf python2.7 \
          python3 python3-pip python3-pyelftools python3-setuptools qemu-utils rsync scons \
          squashfs-tools swig tar texinfo u-boot-tools uglifyjs unzip upx upx-ucl vim wget xmlto xsltproc \
          xxd xz-utils yasm zip zlib1g-dev zstd
        sudo -E systemctl daemon-reload
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get -y clean
        sudo timedatectl set-timezone "$TZ"

    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone Source Code(克隆源代码)
      run: |
        df -hT $GITHUB_WORKSPACE
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

    - name: Generate Variables(生成变量)
      run: |
        SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
        echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
        DEVICE_TARGET=$(grep CONFIG_TARGET_BOARD $CONFIG_FILE | awk -F '"' '{print $2}')
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
        DEVICE_SUBTARGET=$(grep CONFIG_TARGET_SUBTARGET $CONFIG_FILE | awk -F '"' '{print $2}')
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV
        echo "DATE=$(date +"%Y%m%d-%H%M")" >> $GITHUB_ENV
        # 来源信息: 取触发本次构建的用户仓库 commit (替代 LibWrt 上游固定 commit)
        echo "VERSION_INFO=$(git show -s --date=short --format='作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %H')" >> $GITHUB_ENV

    - name: Cache Toolchain + ccache(缓存工具链)
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: true
        mixkey: libwrt-25.12-nss-jdcloud-re-ss-01
        prefix: ${{ env.OPENWRT_PATH }}

    - name: Load Custom Configuration(加载自定义配置)
      run: |
        [ -e files ] && mv files $OPENWRT_PATH/files
        # 用 cp 保留原始配置文件 (Download 步骤需在首次 defconfig 后重新追加)
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE $OPENWRT_PATH/.config
        chmod +x $DIY_SCRIPT
        cd $OPENWRT_PATH
        $GITHUB_WORKSPACE/$DIY_SCRIPT

    - name: Apply Patches(预检 + 应用补丁)
      run: |
        cd $OPENWRT_PATH
        for patch in $GITHUB_WORKSPACE/scripts/*.patch; do
          [ -f "$patch" ] || continue
          if patch -p1 --dry-run < "$patch" >/dev/null 2>&1; then
            patch -p1 < "$patch"
            echo ">>> Applied: $(basename $patch)"
          else
            echo ">>> WARNING: $(basename $patch) 不适用当前源码，跳过"
          fi
        done

    - name: Download DL Package(下载DL软件包)
      run: |
        cd $OPENWRT_PATH
        # ⚡ 关键修复: defconfig → 重新追加配置 → 再 defconfig
        # 第一次 defconfig 会把预制 .config 里的 feeds 可选包重置成 n
        # (OpenWrt quirk: 手写 config 的 feeds 包在首次解析时被丢弃)。
        # 诊断已证实: 把配置重新追加到已解析的 .config 上再 defconfig，
        # feeds 包即可正确保留。故: 先 defconfig 解析基础，再追加原始
        # 配置重新声明所有包，最后 defconfig 定稿。
        make defconfig
        cat "$GITHUB_WORKSPACE/$CONFIG_FILE" >> .config
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Pahole Pre-flight(pahole 前置校验)
      run: |
        cd $OPENWRT_PATH
        # 内核 6.12 的 DEBUG_INFO_BTF 硬依赖: PAHOLE_VERSION >= 116。
        # PAHOLE_VERSION 是 Kconfig 解析期 $(shell) 实时探测系统 PATH 上的 pahole——
        # 已核实全树无任何机制把 staging 自编 pahole 注入内核配置解析环境
        # (KERNEL_MAKE 无 PATH 覆盖, toplevel.mk 只清洗系统 PATH),
        # 探不到记 0 → BTF 静默丢弃, 编译全程零报错。
        # 此处 2 分钟内给出结论, 不等 4 小时全量编译。
        # (原"内核缓存失效检测"步骤已删: 经核实 cachewrtbuild 只缓存
        #  staging_dir/host*+tool*(+ccache), build_dir/dl 从不缓存,
        #  签名文件永不被恢复, 该步骤恒判"变化"恒 clean, 纯空转)
        if ! grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config; then
          echo "::error::.config 无 CONFIG_KERNEL_DEBUG_INFO_BTF=y (defconfig 丢弃, 依赖链: KERNEL_DEBUG_INFO && !KERNEL_DEBUG_INFO_REDUCED)"
          exit 1
        fi
        make tools/dwarves/compile -j$(nproc) >/dev/null 2>&1 || true
        echo "--- pahole 探测结果 ---"
        for p in "$OPENWRT_PATH/staging_dir/host/bin/pahole" /usr/bin/pahole; do
          if [ -x "$p" ]; then echo "  $p: $($p --version 2>&1)"; else echo "  $p: 不存在"; fi
        done
        which -a pahole 2>/dev/null || echo "  PATH 上无 pahole"
        if ! command -v pahole >/dev/null 2>&1; then
          echo "::error::系统 PATH 无 pahole — 内核 Kconfig 将解析出 PAHOLE_VERSION=0, DEBUG_INFO_BTF 必被静默丢弃。需在 apt 清单加 dwarves"
          exit 1
        fi
        echo "✅ pahole 前置校验通过"

    - name: Diagnose defconfig(诊断包解析结果)
      run: |
        cd $OPENWRT_PATH
        echo "===== defconfig 解析后的关键包状态 ====="
        echo "(=y 表示保留, 'is not set' 表示被依赖冲突丢弃)"
        for sym in \
          CONFIG_PACKAGE_luci-app-passwall \
          CONFIG_PACKAGE_xray-core \
          CONFIG_PACKAGE_sing-box \
          CONFIG_PACKAGE_chinadns-ng \
          CONFIG_PACKAGE_dns2socks \
          CONFIG_PACKAGE_microsocks \
          CONFIG_PACKAGE_ipt2socks \
          CONFIG_PACKAGE_luci-app-openclash \
          CONFIG_PACKAGE_luci-app-samba4 \
          CONFIG_PACKAGE_samba4-server \
          CONFIG_PACKAGE_wsdd2 \
          CONFIG_PACKAGE_luci-app-upnp \
          CONFIG_PACKAGE_miniupnpd-nftables \
          CONFIG_PACKAGE_htop \
          CONFIG_PACKAGE_openssh-sftp-server \
          CONFIG_PACKAGE_luci-app-ttyd \
          CONFIG_PACKAGE_ttyd \
          CONFIG_PACKAGE_luci-app-filemanager \
          CONFIG_PACKAGE_luci-app-lucky \
          CONFIG_PACKAGE_luci-app-mosdns \
          CONFIG_PACKAGE_kmod-wireguard \
          CONFIG_PACKAGE_kmod-nf-socket \
          CONFIG_PACKAGE_kmod-nft-tproxy ; do
            line=$(grep -E "^${sym}(=| is not set)" .config | head -1)
            if [ -z "$line" ]; then
                echo "  [ABSENT] $sym (配置中无此项)"
            else
                echo "  $line"
            fi
        done
        echo "===== Go 工具链状态 (xray/sing-box 依赖) ====="
        grep -E "^CONFIG_GOLANG_VERSION|^CONFIG_PACKAGE_golang" .config | head -5 || echo "  (无 golang 配置)"
        echo "===== 诊断结束 ====="

    - name: Compile Firmware(开始编译固件)
      id: compile
      run: |
        cd $OPENWRT_PATH
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    - name: Diagnose kernel config(内核配置诊断)
      if: steps.compile.outputs.status == 'success'
      run: |
        cd $OPENWRT_PATH
        echo "=== 解析后的内核配置 (DEBUG_INFO / PAHOLE / BPF 相关) ==="
        # CONFIG_PAHOLE_VERSION 是 Kconfig 解析期 $(shell) 探测 pahole 的实际值,
        # =0 即探测失败, DEBUG_INFO_BTF 被静默丢弃。找不到 .config 属基础设施
        # 问题, 直接硬失败, 不浪费下一轮 4 小时。
        # (教训: 曾用 -maxdepth 2 搜目录, 命中的是 linux-qualcommax_ipq60xx
        #  外层目录, .config 在其下一级, 导致本步骤必然输出"未找到")
        KCFG="$(find "$OPENWRT_PATH/build_dir" -maxdepth 4 -type f -name .config -path '*/linux-*/linux-*/.config' | head -1)"
        if [ -z "$KCFG" ]; then
            echo "::error::未找到内核 .config (期望: build_dir/target-*/linux-*/linux-*/.config)"
            find "$OPENWRT_PATH/build_dir" -maxdepth 4 -type d -name 'linux-*' 2>/dev/null | head -5 || true
            exit 1
        fi
        echo "目标文件: $KCFG"
        grep -E '^#? ?CONFIG_(DEBUG_INFO|DEBUG_KERNEL|PAHOLE|BPF_SYSCALL|CGROUP_BPF|NET_CLS_BPF|NET_SCH_INGRESS|VETH)' "$KCFG" || echo "(无匹配行)"
        echo "--- pahole 版本 ---"
        "$OPENWRT_PATH/staging_dir/host/bin/pahole" --version 2>/dev/null || echo "(staging_dir pahole 不存在)"
        /usr/bin/pahole --version 2>/dev/null || echo "(系统 pahole 不存在)"
        echo "--- 磁盘容量 ---"
        df -h "$OPENWRT_PATH" | tail -1
        echo "=== 诊断结束 ==="

    - name: Verify packages(校验关键包)
      if: steps.compile.outputs.status == 'success'
      run: |
        cd $OPENWRT_PATH
        echo "=== 校验关键包 ==="

        # --- 固件镜像必须产出 (硬失败) ---
        if ! find bin/targets -name "*sysupgrade.bin" 2>/dev/null | grep -q .; then
            echo "::error::未找到 sysupgrade 固件镜像，编译异常!"
            exit 1
        fi
        echo "✅ 固件镜像已产出"

        # --- 内核 BTF 硬验证门 (dae 硬前提) ---
        # 教训 (run 33390082108): -maxdepth 3 够不到真实内核 vmlinux (第 4 层:
        # build_dir/target-*/linux-*/linux-6.12.x/vmlinux), 曾对某个不明文件
        # 作出判断, 失败结论不可信。现去掉深度限制、限定内核源码树路径、
        # 成功失败都打印路径。无 BTF 禁止发布。
        echo "--- 内核 BTF 验证 (第1层: vmlinux) ---"
        VMLINUX="$(find "$OPENWRT_PATH/build_dir" -type f -name vmlinux -path '*/linux-*/linux-*/vmlinux' | head -1)"
        if [ -z "$VMLINUX" ]; then
            echo "::error::build_dir 未找到内核 vmlinux (期望: build_dir/target-*/linux-*/linux-*/vmlinux), 无法验证 BTF"
            find "$OPENWRT_PATH/build_dir" -type f -name vmlinux 2>/dev/null | head -5 || true
            exit 1
        fi
        echo "目标文件: $VMLINUX ($(du -h "$VMLINUX" | cut -f1))"
        if readelf -S "$VMLINUX" 2>/dev/null | grep -q '\.BTF'; then
            echo "✅ vmlinux 含 .BTF 段 ($VMLINUX)"
        else
            echo "::error::vmlinux 无 .BTF 段 ($VMLINUX)! 对照上方内核配置诊断输出 (CONFIG_PAHOLE_VERSION/DEBUG_INFO/DWARF4), 禁止发布"
            exit 1
        fi
        echo "--- 内核 BTF 验证 (第2层: 固件镜像) ---"
        FW_BIN="$(find bin/targets -name '*sysupgrade.bin' | head -1)"
        CHECK_DIR="$(mktemp -d)"
        tar -xf "$FW_BIN" -C "$CHECK_DIR"
        ITB="$(find "$CHECK_DIR" -type f -name kernel | head -1)"
        [ -n "$ITB" ] || { echo "::error::固件包内未找到 kernel 成员"; exit 1; }
        KIMG=""
        # kernel 成员是 FIT 镜像 (d0 0d fe ed), 逐个位置提取找内核子映像
        for pos in 0 1 2; do
            dumpimage -T flat_dt -p "$pos" -o "$CHECK_DIR/sub.img" "$ITB" >/dev/null 2>&1 || continue
            if gzip -t "$CHECK_DIR/sub.img" 2>/dev/null; then
                gzip -dc "$CHECK_DIR/sub.img" > "$CHECK_DIR/sub.raw" 2>/dev/null || continue
            elif xz --format=lzma -t "$CHECK_DIR/sub.img" 2>/dev/null; then
                xz --format=lzma -dc "$CHECK_DIR/sub.img" > "$CHECK_DIR/sub.raw" 2>/dev/null || continue
            else
                cp "$CHECK_DIR/sub.img" "$CHECK_DIR/sub.raw"
            fi
            # aarch64 Image 魔数 "ARM\x64" 位于偏移 0x38
            if [ "$(dd if="$CHECK_DIR/sub.raw" bs=1 skip=56 count=4 2>/dev/null)" = "ARMd" ]; then
                KIMG="$CHECK_DIR/sub.raw"
                echo "  FIT position $pos = 内核镜像 (aarch64 Image, $(wc -c < "$CHECK_DIR/sub.raw") bytes)"
                break
            fi
        done
        if [ -z "$KIMG" ]; then
            echo "::error::未能从固件 FIT 中提取内核镜像, 无法验证"
            hexdump -C "$ITB" | head -5
            exit 1
        fi
        # BTF 头签名: magic 0xEB9F (le: 9f eb) + version 1 + flags 0 + hdr_len 24 (le)
        if grep -qaP '\x9f\xeb\x01\x00\x18\x00\x00\x00' "$KIMG"; then
            echo "✅ 固件镜像内核包含 BTF"
        else
            echo "::error::固件镜像内核未检出 BTF 头, 禁止发布!"
            exit 1
        fi
        rm -rf "$CHECK_DIR"

        # --- 用户空间包: 以 .ipk 文件存在性判断 (警告，不阻断) ---
        echo "--- 用户空间包 (.ipk 检查) ---"
        PKG_WARN=0
        for pkg in luci-app-passwall xray-core sing-box luci-app-openclash \
                   luci-app-samba4 samba4-server luci-app-lucky luci-app-mosdns \
                   luci-app-upnp miniupnpd-nftables htop openssh-sftp-server \
                   luci-app-ttyd ttyd luci-app-filemanager; do
            if find bin -name "${pkg}_*.ipk" 2>/dev/null | grep -q .; then
                echo "✅ $pkg"
            else
                echo "::warning::$pkg 未找到 .ipk (可能内置/改名/依赖冲突，请核对 defconfig 日志)"
                PKG_WARN=1
            fi
        done

        # --- 内核模块: 在 target manifest 中 (硬失败，此项检查准确) ---
        echo "--- 内核模块 (manifest 检查) ---"
        KMOD_MISSING=0
        for kmod in kmod-nft-tproxy kmod-nf-socket kmod-wireguard kmod-qca-nss-ecm; do
            if find bin/targets -name "*.manifest" -exec grep -l "$kmod" {} \; 2>/dev/null | grep -q .; then
                echo "✅ $kmod"
            else
                echo "::error::内核模块 $kmod 未打入固件!"
                KMOD_MISSING=1
            fi
        done

        if [ $KMOD_MISSING -eq 1 ]; then
            echo "::error::关键内核模块缺失，请检查 .config 与 defconfig 日志"
            exit 1
        fi
        [ $PKG_WARN -eq 1 ] && echo "=== ⚠️ 部分用户空间包未确认，但固件已产出，继续发布 ==="
        echo "=== ✅ 关键校验通过 ==="

    - name: Check Space Usage(检查空间使用情况)
      if: (!cancelled())
      run: df -hT

    - name: Organize Files(整理文件)
      if: steps.compile.outputs.status == 'success'
      run: |
        # 打包全部 ipk (含 kmod) 随 Release 发布，日后保留设置升级补装包无需重编
        cd $OPENWRT_PATH/bin
        echo "=== bin 目录树诊断 ==="
        find . -maxdepth 4 -type d | head -40
        # 定位固件目录: find 驱动, 不依赖 bin/targets 目录层级假设
        # (历史踩坑: cd bin 后 glob targets/*/* 未展开 → "No such file or directory")
        FW_DIR="$(dirname "$(find . -name '*squashfs-sysupgrade.bin' | head -1)")"
        [ -z "$FW_DIR" ] && { echo "::error::未定位到固件产物目录"; exit 1; }
        echo "FW_DIR=$FW_DIR"
        cd "$FW_DIR"
        tar -czf Packages.tar.gz -C "$OPENWRT_PATH/bin" packages 2>/dev/null || \
          tar -czf Packages.tar.gz packages 2>/dev/null || \
          echo "::warning::无 ipk 可打包"
        echo "VERSION_KERNEL=$(find -type f -name "*.manifest" -exec grep -oP '^kernel - \K.*?(?=~|-\d+-)' {} \;)" >> $GITHUB_ENV
        cp $OPENWRT_PATH/.config build.config
        # 只保留 factory + sysupgrade + sha256 + build.config + Packages.tar.gz
        mkdir -p _keep
        cp -f *squashfs-factory.bin *squashfs-sysupgrade.bin _keep/ 2>/dev/null || true
        cp -f build.config _keep/ 2>/dev/null || true
        cd _keep
        sha256sum *factory.bin *sysupgrade.bin > sha256sums 2>/dev/null || true
        cd ..
        rm -f *squashfs-factory.bin *squashfs-sysupgrade.bin build.config sha256sums manifest config
        rm -rf packages feeds.buildinfo version.buildinfo
        mv -f _keep/* . 2>/dev/null || true
        rm -rf _keep
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload Firmware To Release(发布固件)
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
      uses: ncipollo/release-action@v1
      with:
        name: R${{ env.DATE }} for JDCloud RE-SS-01
        allowUpdates: true
        tag: R${{ env.DATE }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        body: |
          **OpenWrt Firmware for JDCloud RE-SS-01 (IPQ6010 魔改亚瑟)**
          
          🕐 编译时间: ${{ env.DATE }}
          
          **固件版本: R${{ env.DATE }}**（LuCI 系统页可直接核对）
          
          ### 设备与内核
          - 设备: JDCloud RE-SS-01 (魔改亚瑟)
          - CPU: IPQ6010 (4x A53 @1.8GHz) / 1GB DDR4 / 128GB eMMC
          - 内核: ${{ env.VERSION_KERNEL }}
          - 源码: LiBwrt/LibWrt (25.12-nss) — ImmortalWrt v25.12.1 基础
          - ${{ env.VERSION_INFO }}
          
          ### 附件说明
          - `Packages.tar.gz`: 全部 ipk 包存档 (含 kmod)，保留设置升级后补装包直接用
          - `build.config`: 本次编译配置快照
          
          ### 预装功能
          - OpenClash (Meta) + Passwall (Xray/SingBox) 双代理
          - Lucky (DDNS/STUN/端口转发)
          - MosDNS 分流 DNS
          - Samba4 NAS 文件共享
          - IPv6 完整支持
          
          ### NSS 硬件加速
          - NSS v11.4 固件 + ECM 前端加速
          - SKB Recycler / WiFi Offload / PPPoE NSS
          - Bridge / VLAN / IPv6 / Mesh 全系驱动
          - MCS / IGS / L2TPv2 / LAG / PPTP 高级模块
          - 预置 nss-status 诊断脚本
          
          ### 网络优化
          - BBR + FQ 拥塞控制 + schedutil CPU 调度
          - NSS SQM (qdisc 引擎: 硬件侧 FQ-CODEL/WFQ)
          - packet_steering=0 (LibWrt 官方: 与 NSS offload 冲突)
          - conntrack max=163840 / buckets=81920 (hash 冲突 -50%)
          - RPS 多核软中断分发 + netdev_budget=600
          - TCP 低延迟 (tw_reuse/fin_timeout=15/syn_backlog=8192)
          - UPnP 租约 7天→1天 (防 conntrack 被占用)
          - SMP IRQ 绑核: nss_queue0~3 全绑核 (CPU2 负载 -88%)
          - NAS 脏页回写 + min_free_kbytes=32768
          - zram swap + swappiness=10
          - overcommit_memory=1 (启发式，避免 Go 代理软件 mmap 失败)
          
          ### 默认信息
          - 默认 IP: 192.168.31.1
          - 默认密码: password

    - name: Delete Old Workflows
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 3
        keep_minimum_runs: 3
