name: Diagnose

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss
  CONFIG_FILE: configs/jdcloud_re_ss01.config
  DIY_SCRIPT: libwrt.sh
  TZ: Asia/Shanghai

permissions:
  contents: read

jobs:
  Diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        sudo -E apt-get -y install $(curl -fsSL is.gd/depends_ubuntu_2204)
        sudo timedatectl set-timezone "$TZ"

    - name: Checkout
      uses: actions/checkout@main

    - name: Clone Source Code
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

    - name: Load Custom Configuration
      run: |
        [ -e files ] && mv files $OPENWRT_PATH/files
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE $OPENWRT_PATH/.config
        chmod +x $DIY_SCRIPT
        cd $OPENWRT_PATH
        $GITHUB_WORKSPACE/$DIY_SCRIPT

    - name: Run defconfig + diagnose
      run: |
        cd $OPENWRT_PATH
        echo "===== feeds 安装情况排查 =====" | tee $GITHUB_WORKSPACE/feeds_inventory.txt
        echo "--- feeds.conf.default ---" | tee -a $GITHUB_WORKSPACE/feeds_inventory.txt
        cat feeds.conf.default 2>/dev/null | tee -a $GITHUB_WORKSPACE/feeds_inventory.txt
        echo "" | tee -a $GITHUB_WORKSPACE/feeds_inventory.txt
        echo "--- ./scripts/feeds 列表 (已安装的 feed) ---" | tee -a $GITHUB_WORKSPACE/feeds_inventory.txt
        ./scripts/feeds list -i 2>&1 | tee -a $GITHUB_WORKSPACE/feeds_inventory.txt
        echo "" | tee -a $GITHUB_WORKSPACE/feeds_inventory.txt
        echo "--- package/feeds/ 目录 (每个 feed 的包链接) ---" | tee -a $GITHUB_WORKSPACE/feeds_inventory.txt
        ls -la package/feeds/ 2>&1 | tee -a $GITHUB_WORKSPACE/feeds_inventory.txt
        echo "" | tee -a $GITHUB_WORKSPACE/feeds_inventory.txt
        echo "--- package/feeds/packages/ 包数量 ---" | tee -a $GITHUB_WORKSPACE/feeds_inventory.txt
        ls package/feeds/packages/ 2>/dev/null | wc -l | tee -a $GITHUB_WORKSPACE/feeds_inventory.txt
        echo "--- package/feeds/luci/ 包数量 ---" | tee -a $GITHUB_WORKSPACE/feeds_inventory.txt
        ls package/feeds/luci/ 2>/dev/null | wc -l | tee -a $GITHUB_WORKSPACE/feeds_inventory.txt
        echo "" | tee -a $GITHUB_WORKSPACE/feeds_inventory.txt
        echo "--- 关键缺失包的 Makefile 是否存在于构建树 ---" | tee -a $GITHUB_WORKSPACE/feeds_inventory.txt
        for p in htop samba4 ttyd luci-app-openclash miniupnpd luci-app-filemanager xray-core sing-box; do
            found=$(find package feeds -maxdepth 4 -type d -name "$p" 2>/dev/null | head -3)
            if [ -n "$found" ]; then
                echo "  [FOUND] $p -> $found" | tee -a $GITHUB_WORKSPACE/feeds_inventory.txt
            else
                echo "  [MISSING] $p (构建树中无此包目录)" | tee -a $GITHUB_WORKSPACE/feeds_inventory.txt
            fi
        done
        echo "" | tee -a $GITHUB_WORKSPACE/feeds_inventory.txt
        echo "===== make defconfig (defconfig → 追加配置 → 再 defconfig) ====="
        make defconfig >/dev/null 2>&1
        cat "$GITHUB_WORKSPACE/$CONFIG_FILE" >> .config
        make defconfig 2>&1 | tee $GITHUB_WORKSPACE/defconfig.log
        echo ""
        echo "===== defconfig 解析后的关键包状态 ====="
        echo "(=y 保留 / 'is not set' 被依赖冲突丢弃 / ABSENT 配置中无此项)"
        for sym in \
          CONFIG_PACKAGE_luci-app-passwall \
          CONFIG_PACKAGE_xray-core \
          CONFIG_PACKAGE_sing-box \
          CONFIG_PACKAGE_chinadns-ng \
          CONFIG_PACKAGE_dns2socks \
          CONFIG_PACKAGE_microsocks \
          CONFIG_PACKAGE_ipt2socks \
          CONFIG_PACKAGE_luci-app-openclash \
          CONFIG_PACKAGE_luci-app-samba4 \
          CONFIG_PACKAGE_samba4-server \
          CONFIG_PACKAGE_wsdd2 \
          CONFIG_PACKAGE_luci-app-upnp \
          CONFIG_PACKAGE_miniupnpd-nftables \
          CONFIG_PACKAGE_htop \
          CONFIG_PACKAGE_openssh-sftp-server \
          CONFIG_PACKAGE_luci-app-ttyd \
          CONFIG_PACKAGE_ttyd \
          CONFIG_PACKAGE_luci-app-filemanager \
          CONFIG_PACKAGE_luci-app-lucky \
          CONFIG_PACKAGE_luci-app-mosdns \
          CONFIG_PACKAGE_kmod-wireguard \
          CONFIG_PACKAGE_kmod-nf-socket \
          CONFIG_PACKAGE_kmod-nft-tproxy ; do
            line=$(grep -E "^#? ?${sym}(=| is not set)" .config | head -1)
            if [ -z "$line" ]; then
                echo "  [ABSENT] $sym" | tee -a $GITHUB_WORKSPACE/diagnose.txt
            else
                echo "  $line" | tee -a $GITHUB_WORKSPACE/diagnose.txt
            fi
        done
        echo "" | tee -a $GITHUB_WORKSPACE/diagnose.txt
        echo "===== Go 工具链状态 =====" | tee -a $GITHUB_WORKSPACE/diagnose.txt
        grep -E "CONFIG_GOLANG_VERSION|CONFIG_PACKAGE_golang|CONFIG_PACKAGE_libstdcpp" .config | head -10 | tee -a $GITHUB_WORKSPACE/diagnose.txt
        echo "" | tee -a $GITHUB_WORKSPACE/diagnose.txt
        echo "===== tmp/.packageinfo 包索引检查 =====" | tee -a $GITHUB_WORKSPACE/diagnose.txt
        echo "  .packageinfo 大小: $(wc -l < tmp/.packageinfo 2>/dev/null) 行" | tee -a $GITHUB_WORKSPACE/diagnose.txt
        for p in htop samba4-server ttyd luci-app-openclash luci-app-samba4 miniupnpd-nftables xray-core sing-box nano; do
            cnt=$(grep -c "^Package: $p$" tmp/.packageinfo 2>/dev/null)
            echo "  $p : 索引中 $cnt 条" | tee -a $GITHUB_WORKSPACE/diagnose.txt
        done
        echo "" | tee -a $GITHUB_WORKSPACE/diagnose.txt
        echo "===== 强制选择测试: htop + samba4-server + ttyd =====" | tee -a $GITHUB_WORKSPACE/diagnose.txt
        cp .config $GITHUB_WORKSPACE/resolved.config
        ./scripts/feeds install -a >/dev/null 2>&1
        echo "CONFIG_PACKAGE_htop=y" >> .config
        echo "CONFIG_PACKAGE_samba4-server=y" >> .config
        echo "CONFIG_PACKAGE_ttyd=y" >> .config
        make defconfig >/dev/null 2>&1
        for p in htop samba4-server ttyd; do
            grep -E "^#? ?CONFIG_PACKAGE_${p}(=| is not set)" .config | head -1 | tee -a $GITHUB_WORKSPACE/diagnose.txt
        done

    - name: Upload diagnostic artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: defconfig-diagnose
        path: |
          ${{ github.workspace }}/diagnose.txt
          ${{ github.workspace }}/defconfig.log
          ${{ github.workspace }}/feeds_inventory.txt
          ${{ github.workspace }}/resolved.config
