# Listmonk 配置文件
# VLOOK OPTICAL 邮件营销系统

[app]
address = "0.0.0.0:9000"
admin_username = "admin"
admin_password = "VlookMail2026!"

# 界面语言
language = "zh-CN"

# 基础 URL（域名配好后改为 https://mail.vlookoptical.com）
root_url = "http://158.178.238.209:9000"

# Logo 和品牌
logo_url = ""
favicon_url = ""
from_email = "noreply@mail.vlookoptical.com"

# 发送并发数（SES 初期建议低一点）
concurrency = 2
# 每秒最大发送数
max_send_errors = 100
# 消息过期时间（小时）
message_expiry = 48

[smtp]
enabled = true
# 配置 Amazon SES（后续阶段填入）
host = "email-smtp.us-east-1.amazonaws.com"
port = 587
auth_protocol = "login"
username = ""
password = ""
hello_hostname = "mail.vlookoptical.com"
max_conns = 2
idle_timeout = "30s"
wait_timeout = "5s"
max_msg_retries = 3

# TLS 设置
tls_type = "STARTTLS"

[db]
host = "db"
port = 5432
user = "listmonk"
password = "listmonk_db_pass_2026"
database = "listmonk"
ssl_mode = "disable"
max_open = 25
max_idle = 5
conn_max_lifetime = "300s"

[privacy]
# 隐私设置
exportable = true
individual_sub_tracking = true
list_unsub_header = true

[webhooks]
# Webhook（退信/投诉处理后续配置）
enabled = false
