# ---------- DNS ----------
dns:
  enable: true
  listen: '[::]:1053'
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # ipv6_proxy=0（只代理 IPv4）⇒ 不能再下发 fake-IP6：否则双栈设备会拿到
  # 2001:2::x 去连一个不被代理的假 IPv6，形成 IPv6 黑洞（页面偶发卡死/超时）。
  # 删除后：境外 AAAA → NODATA；国内域名与 dsh.290490.xyz 的真实 AAAA 仍由
  # fake-ip-filter 的 real-ip 规则解析返回（dns.ipv6 保持 true）。
  fake-ip-filter-mode: rule
  cache-size: 4096
  prefer-h3: false
  # Fake-IP 下境外域名不解析（假 IP 直达节点，由远端解析）；
  # 本地只解析 real-ip 白名单（国内域名 / 连通性检测 / NTP）与直连出站域名。
  # respect-rules=true 会让【每一次】DNS 查询都先跑一遍规则表、并把查询连接丢进
  # 代理链（mihomo 源码: DNSDialer + resolveMetadata），是"Wi-Fi 感叹号 / 首屏转圈 /
  # DNS 与节点互相等待"的直接来源 → 关闭（DNS 服务器改为直连本地网络）。
  respect-rules: false
  use-hosts: true

  # 仅用于解析 DoH/DoT 主机名（本项目上游全是 IP，写死国内 IP 最稳）
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 订阅 / 节点服务器域名：固定国内 DNS，不经代理、不跟随规则
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 兜底上游：国内极速 DNS（境外域名走 fake-IP，一般不会落到这里）
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # ⚠️ 不要写 direct-nameserver：写了它会独占 DIRECT 出站的域名解析，而 nikki mixin
  #    把 direct-nameserver-follow-policy 固定为 false ⇒ nameserver-policy 对 DIRECT
  #    拨号失效（"+.lan" 会被公网 DNS 解析成 NXDOMAIN）。不写 = DIRECT 解析继续走
  #    主 resolver + 下面的 policy（正是我们要的组合）。
  nameserver-policy:
    # 2026-11-10: dsh 是 DDNS 记录（只有 AAAA），联通上游 DNS 的多个缓存实例会互相
    # 打架：同一时刻阿里 DoH 已是新前缀、ISP 仍回旧前缀 ⇒ dsh-dns-guard 每 15 分钟
    # 比对失败 → reload 无效 → 重启 nikki（15s 中断）。这里固定用阿里/腾讯（TTL 60）
    # 拿新鲜值，绕开 dnsmasq/ISP 的缓存分裂；其余 290490 域名仍走 dnsmasq。
    "dsh.290490.xyz":
      - 223.5.5.5
      - 119.29.29.29
    # 内网主机名只认 dnsmasq（mihomo 只读 /etc/hosts，不读 DHCP 租约）
    "+.lan":
      - 192.168.31.1
    # 国内域名：路由器 dnsmasq → 联通 ISP DNS（就近 CDN，用户诉求）。
    # policy 的多服务器是"并发取最快、NXDOMAIN 也算成功"（mihomo batchExchange），
    # 混入公网 DNS 会被随机抢答、失去 ISP 就近效果 ⇒ 这里只放 dnsmasq 单值。
    "rule-set:oc-cn-domain":
      - 192.168.31.1
    # zdcn.list（自定义国内域名，如 tradepower.net）同样走 dnsmasq/ISP，
    # 与 fake-ip-filter 的 real-ip 配套，才能在内核 @china_ip 层直通
    "rule-set:zdcn":
      - 192.168.31.1
    "geosite:private":
      - 192.168.31.1

  fake-ip-filter:
    - DOMAIN,dsh.290490.xyz,real-ip
    # 2026-11-06: 下载域名必须先 fake-ip，不能被 google-cn 的 real-ip 抓成直连 IPv6
    - DOMAIN-SUFFIX,gvt1.com,fake-ip
    - DOMAIN-SUFFIX,gvt2.com,fake-ip
    - DOMAIN-SUFFIX,gvt3.com,fake-ip
    - DOMAIN-SUFFIX,dl.google.com,fake-ip
    # 2026-11-06: 上述域名的 fake-ip 前置覆盖（否则被 @china_ip 内核直连）
    - DOMAIN-SUFFIX,clientservices.googleapis.com,fake-ip
    - DOMAIN-SUFFIX,services.googleapis.cn,fake-ip
    - DOMAIN-SUFFIX,play.googleapis.com,fake-ip
    - DOMAIN-SUFFIX,play.google.com,fake-ip
    - DOMAIN-SUFFIX,play-fe.googleapis.com,fake-ip
    - DOMAIN-SUFFIX,android.clients.google.com,fake-ip
    - DOMAIN-SUFFIX,clients3.google.com,fake-ip
    - DOMAIN-SUFFIX,content-push.googleapis.com,fake-ip
    - DOMAIN-SUFFIX,dl.l.google.com,fake-ip
    - DOMAIN-SUFFIX,tools.google.com,fake-ip
    - DOMAIN-SUFFIX,pki.goog,fake-ip
    - GEOSITE,google-cn,real-ip
    - RULE-SET,oc-cn-domain,real-ip
    - RULE-SET,zdcn,real-ip
    - GEOSITE,private,real-ip
    - DOMAIN-SUFFIX,lan,real-ip
    - DOMAIN-SUFFIX,local,real-ip
    - DOMAIN-SUFFIX,localdomain,real-ip
    - DOMAIN-SUFFIX,home.arpa,real-ip
    - DOMAIN-SUFFIX,msftconnecttest.com,real-ip
    - DOMAIN-SUFFIX,msftncsi.com,real-ip
    - GEOSITE,connectivity-check,real-ip
    - DOMAIN-SUFFIX,ntp.aliyun.com,real-ip
    - DOMAIN-SUFFIX,ntp.tencent.com,real-ip
    - DOMAIN-SUFFIX,cn.pool.ntp.org,real-ip
    - MATCH,fake-ip

# ---------- 规则集 ----------
rule-providers:
  oc-cn-domain:
    type: http
    behavior: domain
    format: mrs
    interval: 43200
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs"
    path: /etc/nikki/run/providers/rule/oc-cn-domain.mrs

  zdcn:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: "https://cdn.jsdelivr.net/gh/Bernardxu123/xu@main/zdcn.list"
    path: /etc/nikki/run/providers/rule/zdcn.list

  zdgw:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: "https://testingcf.jsdelivr.net/gh/Bernardxu123/xu@main/zdgw.list"
    path: /etc/nikki/run/providers/rule/zdgw.list

  oracle:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: "https://testingcf.jsdelivr.net/gh/Bernardxu123/xu@main/oracle.list"
    path: /etc/nikki/run/providers/rule/oracle.list

# ---------- 路由规则 (自上而下, 首个命中) ----------
rules:
  # 私有域 / 局域网 / 组播
  - GEOSITE,private,🎯 直连
  - IP-CIDR,192.168.0.0/16,🎯 直连,no-resolve
  - IP-CIDR,10.0.0.0/8,🎯 直连,no-resolve
  - IP-CIDR,172.16.0.0/12,🎯 直连,no-resolve
  - IP-CIDR,100.64.0.0/10,🎯 直连,no-resolve
  - IP-CIDR,127.0.0.0/8,🎯 直连,no-resolve
  - IP-CIDR,169.254.0.0/16,🎯 直连,no-resolve
  - IP-CIDR,224.0.0.0/3,🎯 直连,no-resolve
  - IP-CIDR6,fdae:8777:3859::/60,🎯 直连,no-resolve
  - IP-CIDR6,fe80::/10,🎯 直连,no-resolve
  - IP-CIDR6,ff00::/8,🎯 直连,no-resolve
  - IP-CIDR6,::1/128,🎯 直连,no-resolve

  # STUN / 游戏 UDP 直连 (IPv4 为主; IPv6 由 guard 统一 fail-closed)
  - AND,((NETWORK,UDP),(DST-PORT,3478)),🎯 直连
  - AND,((NETWORK,UDP),(DST-PORT,19302)),🎯 直连
  - AND,((NETWORK,UDP),(DST-PORT,7844)),🎯 直连

  # NTP
  - DST-PORT,123,🎯 直连

  # 境外 QUIC 零解析拦截（2026-11-03 重写，2026-11-03 18:1x 增补）
  #   旧: (NOT,((GEOIP,CN))) —— fake-IP 下 mihomo 在跑规则前已把 fake-IP 反查成域名
  #   并清空 DstIP，GEOIP 因此会去【真实解析一次域名】（每个 QUIC 连接一次 DNS，
  #   且 respect-rules 时代这次解析还要经代理）；而加 no-resolve 后 GEOIP 拿到的是
  #   无效 IP ⇒ 恒 false ⇒ 等价于"拒绝所有进入 mihomo 的 QUIC"。
  #   现: 域名规则集排除（domainStrategy 只看 RuleHost，绝不触发 DNS）：
  #       · 国内域名放行（HTTP/3 直连）
  #       · GEOIP,CN,no-resolve 只对"纯 IP 连接"生效（DstIP 有效时），零解析成本，
  #         避免误杀内核 @china_ip 没覆盖到的国内 QUIC
  #       · 🍎 Apple 放行：该组默认 DIRECT（Apple 17.x CDN 在境外），拦它的 QUIC 只会
  #         白等 TCP 回落（实测 bag.itunes.apple.com 因此多花 0.13s）；放行后 QUIC 直接
  #         命中 GEOSITE,apple → 🍎 Apple(DIRECT)。
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((RULE-SET,oc-cn-domain))),(NOT,((GEOIP,CN,no-resolve))),(NOT,((GEOSITE,apple)))),REJECT

  # 连通性检测（Windows NCSI / Apple captive）显式直连：
  # 这些域名在 fake-ip-filter 里是 real-ip，真实 IP 常在境外 CDN，若不显式直连会落
  # 到🐟 漏网之鱼→代理，节点抖动时系统会判"无网络"（Wi-Fi 感叹号 / App 首屏慢）。
  - DOMAIN-SUFFIX,msftconnecttest.com,🎯 直连
  - DOMAIN-SUFFIX,msftncsi.com,🎯 直连
  - DOMAIN-SUFFIX,captive.apple.com,🎯 直连

  # 自有服务
  - DOMAIN,vlook.290490.xyz,📚 Learn
  - DOMAIN,pc.290490.xyz,📚 Learn
  - DOMAIN,vklogo.290490.xyz,📚 Learn
  - DOMAIN,learn.290490.xyz,📚 Learn
  - DOMAIN-SUFFIX,290490.xyz,🎯 直连

