# ---------- 基础 ----------
# [nikki mixin 接管] port: 8080（UCI nikki.mixin.http_port；原注释 7890 有误）
# [nikki mixin 接管] socks-port: 1080（UCI nikki.mixin.socks_port；原注释 7891 有误）
# [nikki mixin 接管] redir-port: 7891（UCI nikki.mixin.redir_port；原注释 7892 有误）
# [nikki mixin 接管] mixed-port: 7890（UCI nikki.mixin.mixed_port；原注释 7893 有误）
# [nikki mixin 接管] tproxy-port: 7892（UCI nikki.mixin.tproxy_port；原注释 7895 有误）
# [nikki mixin 接管] allow-lan: true
# [nikki mixin 接管] bind-address：mixin 不下发该键（mihomo 默认全接口监听，受 fw4 input 策略保护）
# ★ 端口 / API / secret / tun / dns.listen 的唯一权威来源是 UCI，见 reports/nikki配置审查与去重优化-20261110.md §生效矩阵
mode: rule
log-level: warning
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: "off"
keep-alive-interval: 180
keep-alive-idle: 600

# [nikki mixin 接管] external-controller: [::]:9090（UCI nikki.mixin.api_listen；原注释 0.0.0.0 有误）
# [nikki mixin 接管] secret: "Y5MNeQyv"
# [nikki mixin 接管] # external-ui / external-ui-name 由 OpenClash 在运行时注入
# [nikki mixin 接管] 
profile:
  store-selected: true
  store-fake-ip: true

geodata-loader: memconservative

# 系统时间由 QWRT 自带 sysntpd 负责（/etc/init.d/sysntpd enabled, ntpd 在跑）；
# 内核 NTP 在 fake-IP 下会把 ntp.aliyun.com 解析成 fake-IP6 并报
#   listenLocalConn ... rAddr=[2001:2::25]:123 permission denied / packet loss，
# write-to-system 还会和 ntpd 抢改系统时钟 → 关闭。
ntp:
  enable: false

