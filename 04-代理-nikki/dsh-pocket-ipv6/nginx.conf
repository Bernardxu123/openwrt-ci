# DSH Pocket IPv6 反向代理（路由器 192.168.31.1）
# - 监听 [::]:3081（仅 IPv6，TLS 由 Let's Encrypt 证书提供，acme.sh DNS-01 自动续期）
# - DDNS（ddns-scripts + update_cloudflare_dsh.sh）把 dsh.290490.xyz 的 AAAA 指向 pppoe-wan 的 IPv6
# - 强制把 Host 改写为公网域名：DSH Pocket 对“裸 IPv6/未知 Host”按 loopback 处理（免密），
#   改写后一律按 public 处理，强制 8 位 PIN，IP 直连无法绕过
# - WebSocket 透传（Upgrade/Connection map），长连接超时 1h
user root;
worker_processes 2;
error_log /var/log/dsh-nginx.error.log warn;
pid /var/run/dsh-nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 512m;
    client_body_buffer_size 128k;
    server_tokens off;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    log_format main '$remote_addr "$request" $status $body_bytes_sent "$http_user_agent"';
    upstream dsh_pocket {
        # 有线 .218 为主（当前在用的静态租约），WiFi .222 作备份
        server 192.168.31.218:3081 max_fails=2 fail_timeout=10s;
        server 192.168.31.222:3081 backup;
    }
    server {
        listen [::]:3081 ssl default_server;
        server_name dsh.290490.xyz;

        ssl_certificate     /etc/dsh-nginx/cert/dsh.fullchain.pem;
        ssl_certificate_key /etc/dsh-nginx/cert/dsh.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:4m;
        ssl_session_timeout 1h;

        access_log /var/log/dsh-nginx.access.log main;
        proxy_http_version 1.1;
        proxy_set_header Host dsh.290490.xyz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_request_buffering off;
        location / { proxy_pass http://dsh_pocket; }
    }
}
