# DSH Pocket IPv6 反向代理（路由器 192.168.31.1）
# - 监听 [::]:3081（仅 IPv6，TLS 由 Let's Encrypt 证书提供，acme.sh DNS-01 自动续期）
# - DDNS（ddns-scripts + update_cloudflare_dsh.sh）把 dsh.290490.xyz 的 AAAA 指向 pppoe-wan 的 IPv6
# - 强制把 Host 改写为公网域名：DSH Pocket 对“裸 IPv6/未知 Host”按 loopback 处理（免密），
#   改写后一律按 public 处理，强制公网 PIN，IP 直连无法绕过
# - WebSocket 透传（Upgrade/Connection map），长连接超时 1h
# - 上游地址由 /etc/dsh-nginx/upstream.conf 维护（dsh-watchdog.sh 每 2 分钟探测 Pocket 实际端口，
#   漂移时自动改写并 reload；DSH Pocket 默认 3081，端口被占会 +1..+9）
user root;
worker_processes 2;
error_log /var/log/dsh-nginx.error.log warn;
pid /var/run/dsh-nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 512m;
    client_body_buffer_size 128k;
    server_tokens off;

    # DSH 上游只对 JS/CSS 做了 gzip；这里补 HTML/JSON/SVG（上游已压缩的会原样透传，不会二次压缩）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # 非 WebSocket 请求发空 Connection，才能启用上游 keepalive
    map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

    log_format main '$remote_addr "$request" $status $body_bytes_sent "$http_user_agent"';

    upstream dsh_pocket {
        include /etc/dsh-nginx/upstream.conf;
        keepalive 16;
    }

    server {
        listen [::]:3081 ssl default_server;
        http2 on;                       # 客户端侧 HTTP/2（nginx 1.26.3 --with-http_v2_module）
        server_name dsh.290490.xyz;

        ssl_certificate     /etc/dsh-nginx/cert/dsh.fullchain.pem;
        ssl_certificate_key /etc/dsh-nginx/cert/dsh.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:4m;
        ssl_session_timeout 1h;

        add_header Strict-Transport-Security "max-age=31536000" always;

        access_log /var/log/dsh-nginx.access.log main;

        proxy_http_version 1.1;
        proxy_set_header Host dsh.290490.xyz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 2s;       # Pocket 未启动时快速 502，不再等 5s×N
        proxy_buffering off;
        proxy_request_buffering off;

        # 带 hash 的静态资源（DSH 升级会换文件名）：一年强缓存，重复打开不再重下
        location ^~ /assets/ {
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            proxy_pass http://dsh_pocket;
        }

        location / { proxy_pass http://dsh_pocket; }
    }
}
