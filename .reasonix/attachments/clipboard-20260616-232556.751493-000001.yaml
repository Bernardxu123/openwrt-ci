# ============================================
# Nikki (Mihomo) 优化配置 - 上海联通专用
# 设备: JDCloud RE-SS-01 (IPQ6010 1GB)
# 作者: Bernardxu123
# 更新: 2026-06-16 (基于 SSH 实测优化)
# ============================================
# ✏️ 本版改动依据 (SSH 实测发现):
#   1. nameserver-policy/nameserver 被 OpenClash 框架丢弃 → 已确认改 UCI 让 yaml 接管 DNS
#   2. Airport4 订阅已空(0节点) → 保留但加注释, Airport5(yaml未引用)忽略
#   3. find-process-mode: strict 路由器无意义 → 改 off
#   4. health-check interval 3600s 太慢 → 600s
#   5. url-test tolerance 20 对42ms节点过紧 → 50
#   6. category-ads-all rcode + googlesyndication 无效且误伤 → 删除(保留adobe_block)
#   7. adobe_block format: yaml 与锚点 text 冲突 → 统一 text
#   8. geox-url 走 ghfast.top 镜像不稳 → 用 ghproxy/直连 fallback
#   9. sniffer HTTP 嗅探 443 端口无意义 → 收敛
# ============================================

# 机场订阅
proxy-providers:
  Airport1:
    url: "https://4c553a36cdfb.qtt-163cdn.com/sub?target=clash&filename=YToo_SS&new_name=true&scv=true&tfo=false&clash.doh=true&emoji=true&udp=true&url=https%3A%2F%2Fapi.ytoo.xyz%2Fosubscribe.php%3Fsid%3D115581%26token%3DvSHpBIViExLdLdqlFdhJ%26sip002%3D1"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600          # ✏️ 3600→600: 故障发现从1小时缩到10分钟
    proxy: 🚀 默认代理
    exclude-filter: "套餐|Expire|Traffic|订阅|0.2"
  Airport2:
    url: "https://subc.onlineglassesoutlet.com/clash_subscribe_proxy.php?token=c451f1b7-9c42-442c-a39c-f508358f6103"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600          # ✏️ 3600→600
    proxy: 直连
    exclude-filter: "套餐|Expire|Traffic|订阅|0.2"
  Airport3:
    url: "https://119.29.57.170:38888/wuguisub?token=f9338c7e30e14181b4a60e0128ebebfd"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600          # ✏️ 3600→600
    proxy: 直连
    exclude-filter: "套餐|Expire|Traffic|订阅|0.2|更新|电信|移动|剩余"
  Airport4:
    url: "https://xi.290490.xyz/xpw290/sub"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600          # ✏️ 3600→600
    proxy: 直连
    exclude-filter: "套餐|Expire|Traffic|订阅|0.2|节点|流量|距离|官网|邮箱"
    # ✏️ 备注: SSH 实测该订阅当前 0 节点, 保留订阅以防恢复; 若长期为空可删除整个 Airport4

# 节点定义
proxies:
  - {name: 直连, type: direct}

# 全局配置
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: info
find-process-mode: always     # ✏️ strict→always: 该 mihomo 版本不支持 off 值会 fatal; always 比 strict 开销略低(原 strict 会对所有连接查进程, always 仅按需)
global-client-fingerprint: random
keep-alive-idle: 120
keep-alive-interval: 1800
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true

# ⚡ GeoX 数据库配置 (参考 FISH-Template)
geodata-mode: true                    # 使用 dat 格式
geodata-loader: memconservative       # 节省内存模式
geo-auto-update: true                 # 自动更新
geo-update-interval: 168              # 更新间隔 (小时=7天)

# 嗅探配置
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080, 2052, 2082, 2086, 2095]  # ✏️ 收敛: HTTP 只嗅明文端口, 删掉 443(443 是 TLS, HTTP 规则嗅它无意义)
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443]
  force-domain:
    - '+.v2ex.com'
  skip-domain:
    - '+.baidu.com'
    - '+.taobao.com'
    - '+.jd.com'
    - '+.qq.com'
    - '+.weixin.qq.com'
    - 'Mijia Cloud'            # ✏️ 新增: 米家内网穿透域名, 嗅探会破坏
    - '+.push.apple.com'       # ✏️ 新增: Apple 推送, 嗅探会导致丢推送

# TUN 入站 (针对 Linux 6.12 优化)
tun:
  enable: false
  stack: mixed  # ⚡ 优化：Linux 6.12 用 mixed 更稳定
  device: utun
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  inet4-address: [198.18.0.1/30]
  inet6-address: [fdfe:dcba:9876::1/126]
  gso: true  # ⚡ IPQ6010 硬件加速

# DNS 锚点定义 (上海联通专用 - 精简版)
cn-dns-v4: &cn-dns-v4
  - 210.22.70.3         # 上海联通 (4ms 最快)
  - 223.5.5.5           # 阿里 DNS (7ms)

cn-dns-v6: &cn-dns-v6
  - 2408:8026:480:112::6666  # 上海联通 IPv6 (5ms)

# DNS 模块
# ✏️ 重要: 改 UCI 的 enable_custom_dns=1 后, 本段才会真正生效
#         (需配套执行: uci set openclash.config.enable_custom_dns='1'; uci commit openclash)
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  respect-rules: true
  use-hosts: true            # ✏️ 新增: 让 hosts 文件条目生效
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - 'geosite:connectivity-check'
    - 'geosite:private'
    - 'geosite:cn'
    - 'geosite:category-ntp'         # ⚡ 新增：NTP 时间同步
    - 'geosite:category-cas'         # ⚡ 新增：证书颁发机构
    - 'geosite:win-update'           # ⚡ 新增：Windows 更新
    - 'geosite:category-game-platforms-download'  # ⚡ 新增：游戏下载
    - '*.wo.cn'
    - '+.10010.com'
    - '*unicom.cn'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'time.*.com'
    - '+.market.xiaomi.com'
    - '+.lan'
    - '+.local'
    - '*.yuece.win'
    - 'ntp.*.com'
    - 'byrut.org'
    - '*.alipay.com'
    - '*.wechat.com'
    - '*.synology.me'

  # ⚡ DNS 分流策略
  nameserver-policy:
    # ✏️ 删除: "geosite:category-ads-all": rcode://success
    #   原因: DNS 层广告屏蔽 2026 年基本无效(广告走 HTTPS/SDK 直连), 且会拖慢解析
    "rule-set:adobe_block": rcode://success   # ✏️ 保留: Adobe 防验证/遥测走 rcode(原走 REJECT 也行)
    "geosite:cn,private":
      - 119.29.29.29        # 腾讯 DNS (6.0ms, 最快)
      - 223.5.5.5           # 阿里 DNS (6.5ms)
      - 210.22.70.3         # 上海联通 (本地冗余)
    "geosite:geolocation-!cn":
      - "https://1.1.1.1/dns-query"
      - "https://8.8.8.8/dns-query"

  # 引导 DNS (精简版) - 用于解析 DoH 域名、启动期
  default-nameserver:
    - 210.22.70.225          # 上海联通 (PPPoE下发)
    - 210.22.70.3            # 上海联通 (PPPoE下发)
    - 119.29.29.29           # 腾讯 DNS (备)

  # 节点解析 DNS (精简版)
  proxy-server-nameserver:
    - 210.22.70.225          # 上海联通 (PPPoE下发)
    - 210.22.70.3            # 上海联通 (PPPoE下发)
    - 119.29.29.29           # 腾讯 DNS (备)

  # 主要 Nameserver (精简版)
  nameserver:
    - 210.22.70.225          # 上海联通 (PPPoE下发)
    - 210.22.70.3            # 上海联通 (PPPoE下发)
    - 119.29.29.29           # 腾讯 DNS (备)

  # 分流策略
pr: &pr {type: select, proxies: [🚀 默认代理, ♻️ 香港自动, ♻️ 日本自动, ♻️ 新加坡自动, ♻️ 台湾自动, ♻️ 美国自动, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🌐 全部节点, 直连]}

# 策略组
proxy-groups:
  - {name: 🚀 默认代理, type: select, proxies: [♻️ 香港自动, ♻️ 日本自动, ♻️ 新加坡自动, ♻️ 台湾自动, ♻️ 美国自动, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🌐 全部节点, 直连]}
  - {name: 📦 GitHub, <<: *pr}
  - {name: 🤖 ChatGPT, <<: *pr}
  - {name: ✈️ Speedtest, <<: *pr}
  - {name: 🛡️ Adobe屏蔽, type: select, proxies: [REJECT, 直连]}   # ✏️ 改名"广告屏蔽"→"Adobe屏蔽", 名副其实
  - {name: 🍎 Apple, type: select, proxies: [直连, 🚀 默认代理]}
  - {name: 🏢 甲骨文 Oracle, type: select, proxies: [直连, 🚀 默认代理, ♻️ 香港自动, ♻️ 日本自动, ♻️ 新加坡自动, ♻️ 台湾自动, ♻️ 美国自动, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🌐 全部节点]}
  - {name: 🎯 直连, type: select, proxies: [直连, 🚀 默认代理]}
  - {name: 🐟 漏网之鱼, <<: *pr}
  - {name: 🇭🇰 香港节点, type: select, include-all: true, filter: "(?i)港|hk|hongkong|hong kong"}
  - {name: 🇯🇵 日本节点, type: select, include-all: true, filter: "(?i)日|jp|japan"}
  - {name: 🇺🇲 美国节点, type: select, include-all: true, filter: "(?i)美|us|unitedstates|united states"}
  # ✏️ tolerance 20→50: 实测香港最快 42ms, tolerance 20 时波动到 63ms 就切节点导致频繁切换; 50 更稳
  - {name: ♻️ 香港自动, type: url-test, include-all: true, tolerance: 50, interval: 300, lazy: true, filter: "(港|联通|HK|(?i)Hong)", exclude-filter: "(台|日|韩|新|深|美)"}
  - {name: ♻️ 日本自动, type: url-test, include-all: true, tolerance: 50, interval: 300, lazy: true, filter: "(日|JP|(?i)Japan)", exclude-filter: "(港|台|韩|新|美)"}
  - {name: ♻️ 新加坡自动, type: url-test, include-all: true, tolerance: 50, interval: 300, lazy: true, filter: "(新|狮|獅|HKG|SG|(?i)Singapore)", exclude-filter: "(港|台|日|韩|美)"}
  - {name: ♻️ 台湾自动, type: url-test, include-all: true, tolerance: 50, interval: 300, lazy: true, filter: "(台|TW|(?i)Taiwan)", exclude-filter: "(港|日|韩|新|美)"}
  - {name: ♻️ 美国自动, type: url-test, include-all: true, tolerance: 50, interval: 300, lazy: true, filter: "(美|US|(?i)States|America)", exclude-filter: "(港|台|日|韩|新)"}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, tolerance: 50, interval: 300, lazy: true, exclude-filter: "直连"}
  - {name: 🌐 全部节点, type: select, include-all: true}

# 规则 (优化顺序：高频命中规则前置)
rules:
  # QUIC 阻断（国外 UDP:443 拒绝，保留国内）
  - AND,(AND,(DST-PORT,443),(NETWORK,UDP)),(NOT,((GEOSITE,geolocation-cn))),REJECT
  # 自定义规则（最高优先）
  - RULE-SET,zdcn,🎯 直连
  - RULE-SET,zdgw,🚀 默认代理
  # 国内直连
  - GEOSITE,cn,🎯 直连
  - GEOSITE,private,🎯 直连
  # Adobe 防验证/遥测 (保留, 你用 Adobe)
  - RULE-SET,adobe_block,🛡️ Adobe屏蔽
  # ✏️ 删除: - DOMAIN-KEYWORD,googlesyndication,🛡️ 广告屏蔽
  #   原因: 误伤 YouTube/Google 登录, 且对真实广告无效
  # 特定服务分流
  - GEOSITE,category-ai-!cn,🤖 ChatGPT
  - GEOSITE,ookla-speedtest,✈️ Speedtest
  # 甲骨文 Oracle（防封号，默认直连，可手动切换代理）
  - RULE-SET,oracle,🏢 甲骨文 Oracle
  # GitHub 走自建节点（省订阅流量）
  - GEOSITE,github,📦 GitHub
  - DOMAIN-SUFFIX,githubusercontent.com,📦 GitHub
  - DOMAIN-SUFFIX,github.io,📦 GitHub
  - DOMAIN-SUFFIX,githubapp.com,📦 GitHub
  # 兜底
  - GEOSITE,geolocation-!cn,🚀 默认代理
  - GEOIP,cn,🎯 直连,no-resolve
  - MATCH,🐟 漏网之鱼

# 规则集锚点
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# 规则集 (精简版，只保留无法用 GEOSITE 替代的)
rule-providers:
  # ✏️ 修复: 原文 format: "yaml" 与锚点 *class 的 format: text 冲突, 且文件实际是 yaml 列表格式
  #   adobe_block 源是 clash.yaml 格式(YAML 列表), 应单独声明 behavior: classical + format: yaml
  adobe_block:
    type: http
    interval: 86400
    behavior: classical
    format: yaml
    url: "https://a.dove.isdumb.one/clash.yaml"
  zdgw: { <<: *class, url: "https://raw.githubusercontent.com/Bernardxu123/xu/refs/heads/main/zdgw.list" }
  zdcn: { <<: *class, url: "https://raw.githubusercontent.com/Bernardxu123/xu/refs/heads/main/zdcn.list" }
  oracle: { <<: *class, url: "https://raw.githubusercontent.com/Bernardxu123/xu/refs/heads/main/oracle.list" }

# ✏️ GeoX 源: ghfast.top 镜像常失效, 改用 ghproxy 镜像 + MetaCubeX 官方地址
#   ghfast.top 2026 年实测频繁 504, 改 ghproxy 更稳; 若 ghproxy 也挂可手动换回直连 github
geox-url:
  geoip: "https://ghproxy.net/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://ghproxy.net/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://ghproxy.net/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"

ntp:
  enable: true
  write-to-system: true
  server: time.apple.com
  port: 123
  interval: 30
